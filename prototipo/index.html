<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<title>Toga — Protótipo</title>
<style>
  :root {
    --bg: oklch(99% 0.002 240);
    --surface: oklch(100% 0 0);
    --fg: oklch(18% 0.012 250);
    --muted: oklch(54% 0.012 250);
    --border: oklch(92% 0.005 250);
    --accent: oklch(58% 0.18 255);
    --accent-text: oklch(48% 0.17 255);
    --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }
  .wrap { max-width: 640px; width: 100%; text-align: center; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-text); }
  h1 { font-family: var(--font-display); font-size: clamp(28px, 5vw, 40px); letter-spacing: -0.02em; margin: 10px 0 12px; }
  p.lead { color: var(--muted); font-size: 15px; line-height: 1.6; max-width: 46ch; margin: 0 auto 36px; }
  .targets { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 520px) { .targets { grid-template-columns: 1fr; } }
  .target-card {
    display: block;
    text-decoration: none;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 20px;
    background: var(--surface);
    transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }
  .target-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 20px -12px oklch(20% 0.01 250 / 0.35); }
  .target-card:active { transform: translateY(0); box-shadow: none; }
  .target-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-color: var(--accent);
  }
  @media (prefers-reduced-motion: reduce) {
    .target-card { transition: border-color 0.15s ease, box-shadow 0.15s ease; }
    .target-card:hover, .target-card:active { transform: none; }
  }
  .target-glyph { width: 40px; height: 40px; margin: 0 auto 14px; color: var(--accent); }
  .logo-mark { width: 52px; height: 52px; border-radius: 14px; overflow: hidden; margin: 0 auto 20px; display: block; }
  .logo-mark img { width: 100%; height: 100%; display: block; }
  .target-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .target-sub { font-size: 13px; color: var(--muted); margin-top: 4px; letter-spacing: 0.01em; }
</style>
</head>
<body>
  <main class="wrap" data-od-id="launcher">
    <div class="logo-mark" data-od-id="logo-mark"><img src="assets/icon.svg" width="52" height="52" alt="Toga"></div>
    <span class="eyebrow">Microapp offline</span>
    <h1>Toga</h1>
    <p class="lead">Protótipo interativo do fluxo de treino gamificado para questões da OAB. Escolha uma plataforma para abrir o app.</p>
    <div class="targets">
      <a class="target-card" href="mobile-ios.html" data-od-id="link-ios">
        <svg class="target-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <rect x="6" y="2" width="12" height="20" rx="3"/>
          <rect x="10.2" y="3.1" width="3.6" height="1.3" rx="0.65" fill="currentColor" stroke="none"/>
        </svg>
        <div class="target-title">iOS</div>
        <div class="target-sub">iPhone · Dynamic Island</div>
      </a>
      <a class="target-card" href="mobile-android.html" data-od-id="link-android">
        <svg class="target-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <rect x="6" y="2" width="12" height="20" rx="3"/>
          <circle cx="12" cy="3.7" r="0.9" fill="currentColor" stroke="none"/>
        </svg>
        <div class="target-title">Android</div>
        <div class="target-sub">Pixel · Material</div>
      </a>
    </div>
  </main>
</body>
</html>
